services:
  api:
    build:
      context: .                   
      dockerfile: backend/src/CakeGestao.API/Dockerfile
    container_name: CAGE_API
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__AccessTokenDurationMinutes=${JWT_ACCESS_EXPIRATION}
      - Jwt__RefreshTokenDurationDays=${JWT_REFRESH_EXPIRATION}
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: CAGE_DB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend  
      dockerfile: Dockerfile
    container_name: CAGE_FRONT
    ports:
      - "4200:80"          
    depends_on:
      - api            

volumes:
  db_data: