<div class="pedido-page-wrapper">
  
  @switch (view()) {
    
    <!-- TELA DE LISTAGEM -->
    @case ('list') {
      <div [style.display]="isLoading() ? 'none' : 'block'">
        <app-pedidos-list
          [pedidos]="pedidos()"
          (novoPedido)="onNovoPedido()"
          (selecionarPedido)="onSelecionarPedido($event)">
        </app-pedidos-list>
      </div>

      @if (isLoading()) {
        <div class="loading-state">
          <span class="material-symbols-outlined spin-icon">progress_activity</span>
          <p>Carregando pedidos da boleria...</p>
        </div>
      }
    }

    @case ('detail') {
      @if (pedidoSelecionado(); as pedido) {
        <app-pedido-detail
          [pedido]="$any(pedido)" 
          (voltar)="view.set('list')"
          (editar)="view.set('create')"
          (alterarStatus)="onAlterarStatus($event)"
          (alterarPagamento)="onAlterarPagamento($event)"
          (excluir)="onExcluirPedido($event)">
        </app-pedido-detail>
      }
    }   

    @case ('create') {
      <app-pedidos-form
        [pedidoParaEditar]="$any(pedidoSelecionado())"
        (cancelar)="view.set('list')"
        (salvar)="onSalvarPedido($event)">
      </app-pedidos-form>
    }
  }

</div>
